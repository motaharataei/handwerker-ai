<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandwerkerAI — Erfolgreich!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            background: #111111;
            border: 1px solid #1e1e1e;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .success-icon {
            font-size: 3.5rem;
        }

        .success-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .success-text {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.7;
        }

        .success-features {
            background: #0a0a0a;
            border: 1px solid #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .success-feature {
            font-size: 0.9rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .success-feature .check {
            color: #4caf50;
        }

        .success-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: background 0.2s;
        }

        .success-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">🎉</div>
        <div class="success-title">Willkommen bei Pro!</div>
        <div class="success-text">
            Dein Abonnement ist aktiv. Du hast jetzt Zugang zu allen 
            Pro-Funktionen von HandwerkerAI.
        </div>

        <div class="success-features">
            <div class="success-feature">
                <span class="check">✓</span> Unbegrenzte Angebote & Rechnungen
            </div>
            <div class="success-feature">
                <span class="check">✓</span> KI-Leistungsbeschreibung
            </div>
            <div class="success-feature">
                <span class="check">✓</span> Spracheingabe
            </div>
            <div class="success-feature">
                <span class="check">✓</span> E-Mail Versand
            </div>
            <div class="success-feature">
                <span class="check">✓</span> Firmenlogo
            </div>
        </div>

        <a href="/" class="success-btn">⚡ Zur App</a>
    </div>
</body>
</html>
